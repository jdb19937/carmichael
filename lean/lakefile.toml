name = "carmichael"
version = "0.1.0"
defaultTargets = ["Carmichael", "Contrib", "AxiomCheck"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# autoImplicit off: a typo'd identifier in a theorem statement must be an
# error, never a silently auto-bound variable (audit hardening, 2026-08-25)
[[lean_lib]]
name = "Carmichael"
leanOptions = { autoImplicit = false }

# Third-party vendored proofs (see Contrib/*.lean headers for provenance;
# Apache 2.0, ported from PrimeNumberTheoremAnd via anthropics/zeta-23-lean)
[[lean_lib]]
name = "Contrib"

# The axiom-closure assertions (#guard_msgs) run at elaboration, so putting
# this in the default build makes `lake build` itself attest the axiom claim
[[lean_lib]]
name = "AxiomCheck"
leanOptions = { autoImplicit = false }
