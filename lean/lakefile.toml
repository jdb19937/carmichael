name = "carmichael"
version = "0.1.0"
defaultTargets = ["Carmichael", "AxiomCheck"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# autoImplicit off: a typo'd identifier in a theorem statement must be an
# error, never a silently auto-bound variable.  Carmichael/Mertens.lean and
# Carmichael/EulerMaclaurin.lean are third-party (Apache 2.0, ported from
# PrimeNumberTheoremAnd via anthropics/zeta-23-lean); provenance in their headers
[[lean_lib]]
name = "Carmichael"
leanOptions = { autoImplicit = false }

# The axiom-closure assertions (#guard_msgs) run at elaboration, so putting
# this in the default build makes `lake build` itself attest the axiom claim
[[lean_lib]]
name = "AxiomCheck"
leanOptions = { autoImplicit = false }
